[package]
name = "desk-paw"
version = "0.1.5"
description = "Open-source desktop cat companion"
authors = ["klockitier"]
edition = "2021"

[lib]
name = "desk_paw_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"
