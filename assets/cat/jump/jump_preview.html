<!doctype html>
<meta charset="utf-8"><title>Jump frames</title>
<style>
  body{background:#15171d;color:#e6e8ef;font:14px system-ui;margin:24px}
  section{display:flex;flex-wrap:wrap;gap:16px;margin-bottom:24px}
  .card{margin:0;background:#20232c;border-radius:10px;padding:10px}
  figcaption{margin-bottom:6px;opacity:.7}
  .stage{width:200px;height:200px;display:grid;place-items:center;
    background:repeating-conic-gradient(#3a3f4b 0 25%,#2a2e38 0 50%) 0 0/20px 20px}
  .stage img{image-rendering:pixelated;transform:scale(1.4)}
  .ctl{display:flex;align-items:center;gap:6px;margin-top:8px;flex-wrap:wrap}
  button{background:#2f3542;color:#e6e8ef;border:0;border-radius:6px;padding:4px 8px;cursor:pointer}
  input{width:52px;background:#2f3542;color:#e6e8ef;border:0;border-radius:6px;padding:3px}
  .n{opacity:.6}
</style>
<h2>Jump Up</h2><section><figure class="card" data-anim="jump_up" data-facing="front" data-frames='["001.png", "002.png", "003.png", "004.png", "005.png", "006.png", "007.png", "008.png"]'><figcaption>front</figcaption><div class="stage"><img alt="jump_up front"></div><div class="ctl"><button data-act="play">▶</button><button data-act="pause">❚❚</button><button data-act="prev">◀</button><button data-act="next">▶|</button><label>fps <input type="number" min="1" max="30" value="12"></label><span class="n"></span></div></figure><figure class="card" data-anim="jump_up" data-facing="left" data-frames='["001.png", "002.png", "003.png", "004.png", "005.png", "006.png", "007.png", "008.png"]'><figcaption>left</figcaption><div class="stage"><img alt="jump_up left"></div><div class="ctl"><button data-act="play">▶</button><button data-act="pause">❚❚</button><button data-act="prev">◀</button><button data-act="next">▶|</button><label>fps <input type="number" min="1" max="30" value="12"></label><span class="n"></span></div></figure><figure class="card" data-anim="jump_up" data-facing="right" data-frames='["001.png", "002.png", "003.png", "004.png", "005.png", "006.png", "007.png"]'><figcaption>right</figcaption><div class="stage"><img alt="jump_up right"></div><div class="ctl"><button data-act="play">▶</button><button data-act="pause">❚❚</button><button data-act="prev">◀</button><button data-act="next">▶|</button><label>fps <input type="number" min="1" max="30" value="12"></label><span class="n"></span></div></figure><figure class="card" data-anim="jump_up" data-facing="back" data-frames='["001.png", "002.png", "003.png", "004.png", "005.png", "006.png", "007.png", "008.png"]'><figcaption>back</figcaption><div class="stage"><img alt="jump_up back"></div><div class="ctl"><button data-act="play">▶</button><button data-act="pause">❚❚</button><button data-act="prev">◀</button><button data-act="next">▶|</button><label>fps <input type="number" min="1" max="30" value="12"></label><span class="n"></span></div></figure></section><h2>Jump Down</h2><section><figure class="card" data-anim="jump_down" data-facing="front" data-frames='["001.png", "002.png", "003.png", "004.png", "005.png", "006.png", "007.png", "008.png"]'><figcaption>front</figcaption><div class="stage"><img alt="jump_down front"></div><div class="ctl"><button data-act="play">▶</button><button data-act="pause">❚❚</button><button data-act="prev">◀</button><button data-act="next">▶|</button><label>fps <input type="number" min="1" max="30" value="12"></label><span class="n"></span></div></figure><figure class="card" data-anim="jump_down" data-facing="left" data-frames='["001.png", "002.png", "003.png", "004.png", "005.png", "006.png", "007.png"]'><figcaption>left</figcaption><div class="stage"><img alt="jump_down left"></div><div class="ctl"><button data-act="play">▶</button><button data-act="pause">❚❚</button><button data-act="prev">◀</button><button data-act="next">▶|</button><label>fps <input type="number" min="1" max="30" value="12"></label><span class="n"></span></div></figure><figure class="card" data-anim="jump_down" data-facing="right" data-frames='["001.png", "002.png", "003.png", "004.png", "005.png", "006.png", "007.png", "008.png"]'><figcaption>right</figcaption><div class="stage"><img alt="jump_down right"></div><div class="ctl"><button data-act="play">▶</button><button data-act="pause">❚❚</button><button data-act="prev">◀</button><button data-act="next">▶|</button><label>fps <input type="number" min="1" max="30" value="12"></label><span class="n"></span></div></figure><figure class="card" data-anim="jump_down" data-facing="back" data-frames='["001.png", "002.png", "003.png", "004.png", "005.png", "006.png"]'><figcaption>back</figcaption><div class="stage"><img alt="jump_down back"></div><div class="ctl"><button data-act="play">▶</button><button data-act="pause">❚❚</button><button data-act="prev">◀</button><button data-act="next">▶|</button><label>fps <input type="number" min="1" max="30" value="12"></label><span class="n"></span></div></figure></section>
<script>
for (const card of document.querySelectorAll('.card')) {
  const frames = JSON.parse(card.dataset.frames);
  const dir = `${card.dataset.anim.split('_')[1]}/${card.dataset.facing}/`;
  const img = card.querySelector('img'), n = card.querySelector('.n');
  const fps = card.querySelector('input');
  let i = 0, timer = null;
  const show = () => { img.src = dir + frames[i]; n.textContent = `${i + 1}/${frames.length}`; };
  const step = d => { i = (i + d + frames.length) % frames.length; show(); };
  const play = () => { stop(); timer = setInterval(() => step(1), 1000 / +fps.value); };
  const stop = () => { clearInterval(timer); timer = null; };
  card.querySelector('[data-act=play]').onclick = play;
  card.querySelector('[data-act=pause]').onclick = stop;
  card.querySelector('[data-act=prev]').onclick = () => { stop(); step(-1); };
  card.querySelector('[data-act=next]').onclick = () => { stop(); step(1); };
  fps.onchange = () => { if (timer) play(); };
  show(); play();
}
</script>
