name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
            name: macOS Apple Silicon
          - platform: macos-latest
            args: --target x86_64-apple-darwin
            name: macOS Intel

    runs-on: ${{ matrix.platform }}
    name: ${{ matrix.name }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and upload release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: Desk Paw v__VERSION__
          releaseBody: |
            Download a macOS build below and open the `.dmg`.

            **First launch (unsigned build):** right-click the app → **Open**, or run:
            ```bash
            xattr -cr "/Applications/Desk Paw.app"
            ```

            Apple Silicon and Intel builds are both attached when the release finishes.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
